<body>
<div class="wrap">
  <header>
    <h1>Solving Equations</h1>
    <p>Big Ideas Math — Algebra 1 · Sections 1.1–1.3</p>
  </header>

  <div class="bar-panel">
    <div class="bar-top-row">
      <span class="label" id="progressLabel">Question 1 of 10</span>
      <span class="score-pill" id="scorePill">Score: 0/10</span>
    </div>
    <div class="segments" id="segments"></div>
    <div class="qnums" id="qnums"></div>
  </div>

  <div class="card">
    <div id="quizArea">
      <div class="tag" id="sectionTag">1.1</div>
      <div class="qcount" id="qcount">Question 1 of 10</div>
      <p class="prompt" id="prompt"></p>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="nextbtn" id="nextBtn">Next Question →</button>
    </div>

    <div class="results" id="results">
      <div class="tag">Complete</div>
      <div class="bigscore" id="finalScore">0/10</div>
      <div class="msg" id="finalMsg"></div>
      <div class="breakdown" id="breakdown"></div>
      <button class="restartbtn" id="restartBtn">Retake Quiz</button>
    </div>
  </div>
</div>

<script>
const questions = [
  {
    section:"1.1",
    prompt:"Solve: x + 9 = 4",
    options:["x = 13","x = -5","x = 5","x = -13"],
    correct:1,
    explain:"Subtract 9 from both sides: x = 4 − 9 = −5."
  },
  {
    section:"1.1",
    prompt:"Solve: -6x = 42",
    options:["x = -7","x = 7","x = 36","x = -36"],
    correct:0,
    explain:"Divide both sides by −6: x = 42 ÷ (−6) = −7."
  },
  {
    section:"1.1",
    prompt:"Solve: x/5 = -3",
    options:["x = -15","x = -8","x = 15","x = 8"],
    correct:0,
    explain:"Multiply both sides by 5: x = −3 × 5 = −15."
  },
  {
    section:"1.2",
    prompt:"Solve: 4x + 7 = 23",
    options:["x = 6","x = 4","x = 7.5","x = 30"],
    correct:1,
    explain:"Subtract 7: 4x = 16. Divide by 4: x = 4."
  },
  {
    section:"1.2",
    prompt:"Solve: 2(x - 3) = 10",
    options:["x = 2","x = 8","x = 5","x = 11"],
    correct:1,
    explain:"Distribute: 2x − 6 = 10 → 2x = 16 → x = 8."
  },
  {
    section:"1.2",
    prompt:"Solve: -3x + 5 = -4",
    options:["x = 3","x = -3","x = 1/3","x = -1"],
    correct:0,
    explain:"Subtract 5: −3x = −9. Divide by −3: x = 3."
  },
  {
    section:"1.3",
    prompt:"Solve: 5x + 3 = 2x + 12",
    options:["x = 3","x = 5","x = -3","x = 15"],
    correct:0,
    explain:"Subtract 2x from both sides: 3x + 3 = 12 → 3x = 9 → x = 3."
  },
  {
    section:"1.3",
    prompt:"Solve: 3(x - 2) = x + 4",
    options:["x = 1","x = 5","x = -1","x = 10"],
    correct:1,
    explain:"Distribute: 3x − 6 = x + 4. Subtract x: 2x − 6 = 4 → 2x = 10 → x = 5."
  },
  {
    section:"1.3",
    prompt:"How many solutions does 2x + 4 = 2x - 1 have?",
    options:["One solution","No solution","Infinitely many solutions","x = 0"],
    correct:1,
    explain:"Subtracting 2x from both sides leaves 4 = −1, which is false — so there is no solution."
  },
  {
    section:"1.3",
    prompt:"How many solutions does 6x + 9 = 3(2x + 3) have?",
    options:["No solution","One solution: x = 0","Infinitely many solutions","x = 3"],
    correct:2,
    explain:"Distribute the right side: 6x + 9 = 6x + 9. Both sides are identical — every value of x works, so there are infinitely many solutions."
  }
];

let current = 0;
let score = 0;
let answered = new Array(questions.length).fill(null); // null | true | false

const segmentsEl = document.getElementById('segments');
const qnumsEl = document.getElementById('qnums');
const progressLabel = document.getElementById('progressLabel');
const scorePill = document.getElementById('scorePill');
const sectionTag = document.getElementById('sectionTag');
const qcount = document.getElementById('qcount');
const promptEl = document.getElementById('prompt');
const optionsEl = document.getElementById('options');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizArea = document.getElementById('quizArea');
const resultsEl = document.getElementById('results');

function buildSegments(){
  segmentsEl.innerHTML = '';
  qnumsEl.innerHTML = '';
  questions.forEach((q, i) => {
    const seg = document.createElement('div');
    seg.className = 'seg';
    seg.id = 'seg-' + i;
    segmentsEl.appendChild(seg);

    const num = document.createElement('span');
    num.textContent = i + 1;
    qnumsEl.appendChild(num);
  });
}

function updateSegments(){
  questions.forEach((q, i) => {
    const seg = document.getElementById('seg-' + i);
    seg.classList.remove('current','correct','incorrect');
    if(answered[i] === true) seg.classList.add('correct');
    else if(answered[i] === false) seg.classList.add('incorrect');
    if(i === current) seg.classList.add('current');
  });
}

function updateHeader(){
  progressLabel.textContent = `Question ${current+1} of ${questions.length}`;
  scorePill.textContent = `Score: ${score}/${questions.length}`;
}

function loadQuestion(){
  const q = questions[current];
  sectionTag.textContent = q.section;
  qcount.textContent = `Question ${current+1} of ${questions.length}`;
  promptEl.textContent = q.prompt;
  optionsEl.innerHTML = '';
  feedbackEl.className = 'feedback';
  feedbackEl.innerHTML = '';
  nextBtn.classList.remove('show');

  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsEl.appendChild(btn);
  });

  updateHeader();
  updateSegments();
}

function selectAnswer(idx){
  const q = questions[current];
  const optionButtons = optionsEl.querySelectorAll('.option');
  const isCorrect = idx === q.correct;

  optionButtons.forEach((btn, i) => {
    btn.disabled = true;
    if(i === q.correct){
      btn.classList.add(isCorrect && i === idx ? 'selected-correct' : 'reveal-correct');
    } else if(i === idx && !isCorrect){
      btn.classList.add('selected-incorrect');
    }
  });

  if(answered[current] === null){
    if(isCorrect) score++;
  }
  answered[current] = isCorrect;

  feedbackEl.classList.add('show', isCorrect ? 'correct' : 'incorrect');
  feedbackEl.innerHTML = `<b>${isCorrect ? "Correct!" : "Not quite."}</b>${q.explain}`;

  updateHeader();
  updateSegments();

  nextBtn.textContent = current === questions.length - 1 ? "See Results →" : "Next Question →";
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  if(current < questions.length - 1){
    current++;
    loadQuestion();
  } else {
    showResults();
  }
});

function showResults(){
  quizArea.style.display = 'none';
  resultsEl.classList.add('show');

  document.getElementById('finalScore').textContent = `${score}/${questions.length}`;
  const pct = Math.round((score/questions.length)*100);
  let msg = "";
  if(pct === 100) msg = "Perfect score! You've mastered sections 1.1–1.3.";
  else if(pct >= 80) msg = "Great work! Just a couple to review.";
  else if(pct >= 60) msg = "Good effort — review the missed ones below.";
  else msg = "Keep practicing — review the explanations below.";
  document.getElementById('finalMsg').textContent = msg;

  const breakdown = document.getElementById('breakdown');
  breakdown.innerHTML = '';
  questions.forEach((q, i) => {
    const row = document.createElement('div');
    row.className = 'breakdown-item';
    const dot = document.createElement('div');
    dot.className = 'dot ' + (answered[i] ? 'correct' : 'incorrect');
    const txt = document.createElement('div');
    txt.className = 'qtxt';
    txt.textContent = `${i+1}. [${q.section}] ${q.prompt}`;
    row.appendChild(dot);
    row.appendChild(txt);
    breakdown.appendChild(row);
  });
}

document.getElementById('restartBtn').addEventListener('click', () => {
  current = 0;
  score = 0;
  answered = new Array(questions.length).fill(null);
  quizArea.style.display = 'block';
  resultsEl.classList.remove('show');
  loadQuestion();
});

buildSegments();
loadQuestion();
</script>
</body>
</html>
